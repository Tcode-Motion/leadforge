name: LeadForge CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '.env.example'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
        shell: bash

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m py_compile dashboard/app.py dashboard/whatsapp_agent.py dashboard/standalone_apps.py dashboard/intelligence.py tests/*.py
        shell: bash

      - name: Run 19 Fault Injection Resilience Tests
        run: |
          python tests/run_fault_tests.py
        shell: bash

      - name: Run HTTP Endpoints & API Integration Suite
        run: |
          python tests/test_endpoints.py
        shell: bash

  summary:
    name: CI Status Gate
    needs: test-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Matrix Results
        run: |
          if [ "${{ needs.test-matrix.result }}" = "success" ]; then
            echo "All matrix test combinations passed successfully!"
            exit 0
          else
            echo "One or more matrix jobs failed."
            exit 1
          fi
